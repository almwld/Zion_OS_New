name: Vendor complete Agent Skills corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tooling/sync_agent_skills.py"
      - ".github/workflows/sync-agent-skills.yml"

permissions:
  contents: write

concurrency:
  group: vendor-agent-skills-final
  cancel-in-progress: true

jobs:
  vendor-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Zion OS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android PRoot runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/OpenMinis/OpenMinis.git "$RUNNER_TEMP/openminis"
          cd "$RUNNER_TEMP/openminis"
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/assets"
          cp src/android/app/src/main/assets/proot-aarch64 "$GITHUB_WORKSPACE/android/app/src/main/assets/proot-aarch64"
          cp src/android/app/src/main/jniLibs/arm64-v8a/libproot.so "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/"
          cp src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/"
          cp src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/assets/proot-aarch64"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libproot.so"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendor all upstream skills and full source tree
        run: python tooling/sync_agent_skills.py

      - name: Verify generated corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("assets/agent_skills/community_catalog.json").read_text())
          entries = catalog["entries"]
          assert catalog["skill_count"] == len(entries) >= 1000, catalog["skill_count"]
          assert len({entry["name"] for entry in entries}) == len(entries)
          assert all(Path(entry["asset"]).is_file() for entry in entries)
          assert Path("assets/agent_skills/community_bundle.zip").stat().st_size > 100_000
          print(f"Validated {len(entries)} skills; full source bundle is present.")
          PY

      - name: Commit complete offline corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/agent_skills/community assets/agent_skills/community_catalog.json assets/agent_skills/community_bundle.zip
          if git diff --cached --quiet; then
            echo "The vendored corpus is already up to date."
          else
            git commit -m "chore(agent): vendor complete offline skill corpus"
            git push origin HEAD:main
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Fetch bundled Musnad font
        run: bash tool/fetch_musnad_font.sh

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --no-pub

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Verify required Flutter assets and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          test -d assets/fonts
          test -f assets/icons/app_icon.png
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png || test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.webp

      - name: Build release APK
        run: flutter build apk --release --split-per-abi --no-shrink

