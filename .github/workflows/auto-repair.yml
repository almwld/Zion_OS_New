name: Zion OS Auto Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zion-auto-repair-main
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Repair known source corruption
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text(encoding='utf-8')
              s2 = fn(s)
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
                  print(f'repaired {path}')

          edit('lib/features/exploitation/exploit_screen.dart',
               lambda s: re.sub(r'\);n[ \t]+', ');\n        ', s))

          edit('lib/core/arsenal/zion_web.dart',
               lambda s: s.replace(
                   "body: '{\\\"query\\\": {\\\"match_all\\\": {}}}';",
                   "body: '{\\\"query\\\": {\\\"match_all\\\": {}}}',"))

          edit('lib/core/arsenal/zion_postexploit.dart',
               lambda s: s.replace("'C$'", "'C\\$'"))

          def repair_viewmode(s):
              if 'class AdvancedFileManager extends StatefulWidget {' not in s:
                  return s
              s = s.replace('class AdvancedFileManager extends StatefulWidget {',
                            'enum ViewMode { grid, list }\n\nclass AdvancedFileManager extends StatefulWidget {', 1)
              return s.replace('\n  enum ViewMode { grid, list }\n', '\n', 1)
          edit('lib/src/features/files/advanced_file_manager.dart', repair_viewmode)

          def repair_wifi_imports(s):
              late = [
                  "import 'zion_router_exploits.dart';",
                  "import 'zion_ai_password_guesser.dart';",
                  "import 'zion_guest_network_hack.dart';",
                  "import 'zion_upnp_hack.dart';",
              ]
              for item in late:
                  s = s.replace('\n' + item, '')
              anchor = "import 'package:wifi_p2p/wifi_p2p.dart';"
              if anchor in s and late[0] not in s.split(anchor, 1)[0]:
                  s = s.replace(anchor, anchor + '\n' + '\n'.join(late), 1)
              return s
          edit('lib/src/core/arsenal/zion_wifi_real.dart', repair_wifi_imports)

          def repair_unified(s):
              s = re.sub(r'(Future<String> _dnsLookup\(String d\) async \{.*?\n  \})\n  \}', r'\1', s, count=1, flags=re.S)
              s = re.sub(r'\n  case \'proot_status\':\n    final prootPath = await KaliLoaderService\.findProot\(\);\n    if \(prootPath != null\) \{\n      return \'[^\n]*\';\n    \} else \{\n      return \'[^\n]*\';\n    \}', '', s, count=1)
              marker = "      if (command == 'help') return _helpText();"
              if marker in s and "command == 'proot_status'" not in s:
                  insertion = "      if (command == 'proot_status') {\n        final prootPath = await KaliLoaderService.findProot();\n        return prootPath != null\n            ? 'proot موجود: $prootPath'\n            : 'proot غير موجود.';\n      }\n\n"
                  s = s.replace(marker, insertion + marker, 1)
              return s
          edit('lib/core/services/unified_core_service.dart', repair_unified)

          def repair_help(s):
              s = s.replace(
                  "return SingleChildScrollWidget('Phone', Icons.phone),child: Column(",
                  "return SingleChildScrollView(child: Column(", 1)
              s = re.sub(r"\n\}','Phone', Icons\.phone\),child: Column\(.*\Z", '\n', s, count=1, flags=re.S)
              return s
          edit('lib/screens/help/advanced_help_center.dart', repair_help)

          def repair_settings(s):
              return re.sub(r'\n\}\n\n  void _resetAllSettings\(\) async \{.*\Z', '\n}\n', s, count=1, flags=re.S)
          edit('lib/screens/settings/settings_screen.dart', repair_settings)

          def repair_wifi_panel(s):
              s = re.sub(r'\n  // إضافة أزرار للاستراتيجيات الجديدة.*?\nclass _StrategyButton', '\n\nclass _StrategyButton', s, count=1, flags=re.S)
              if s.rstrip().endswith('child: Text(label, style: const TextStyle(color: Colors.white, fontSize: 12)),\n  );\n  }'):
                  s = s.rstrip() + '\n}\n'
              return s
          edit('lib/src/features/wifi/zion_wifi_panel_real.dart', repair_wifi_panel)
          PY

      - name: Format Dart sources
        run: dart format lib test

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No repair changes were required.'
            exit 0
          fi
          git add lib test
          git commit -m 'fix: repair Dart syntax and normalize sources'
          git push origin main
