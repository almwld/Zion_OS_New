name: Zion OS Auto Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zion-auto-repair-main
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Repair known source corruption
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text(encoding='utf-8')
              s2 = fn(s)
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
                  print(f'repaired {path}')

          def repair_stray_n(s):
              return re.sub(r'\);n(?=[ \t]*(?:buffer|\w))', ');\n', s)
          edit('lib/features/exploitation/exploit_screen.dart', repair_stray_n)

          def repair_web(s):
              # Named arguments are comma-separated. The Elasticsearch request
              # had a statement terminator inside the argument list.
              return re.sub(
                  r"(Future<bool> elasticsearchInjection\(String url\) async \{.*?body:\s*'[^']*')\s*;",
                  r'\1,', s, count=1, flags=re.S)
          edit('lib/core/arsenal/zion_web.dart', repair_web)

          edit('lib/core/arsenal/zion_postexploit.dart',
               lambda s: s.replace("'C$'", "'C\\$'"))

          def repair_viewmode(s):
              if 'class AdvancedFileManager extends StatefulWidget {' not in s:
                  return s
              if 'enum ViewMode { grid, list }' not in s.split('class AdvancedFileManager extends StatefulWidget {', 1)[0]:
                  s = s.replace('class AdvancedFileManager extends StatefulWidget {',
                                'enum ViewMode { grid, list }\n\nclass AdvancedFileManager extends StatefulWidget {', 1)
              return s.replace('\n  enum ViewMode { grid, list }\n', '\n', 1)
          edit('lib/src/features/files/advanced_file_manager.dart', repair_viewmode)

          def repair_wifi_imports(s):
              late = [
                  "import 'zion_router_exploits.dart';",
                  "import 'zion_ai_password_guesser.dart';",
                  "import 'zion_guest_network_hack.dart';",
                  "import 'zion_upnp_hack.dart';",
              ]
              for item in late:
                  s = s.replace('\n' + item, '')
              anchor = "import 'package:wifi_p2p/wifi_p2p.dart';"
              if anchor in s:
                  prefix, suffix = s.split(anchor, 1)
                  if late[0] not in prefix:
                      s = prefix + anchor + '\n' + '\n'.join(late) + suffix
              return s
          edit('lib/src/core/arsenal/zion_wifi_real.dart', repair_wifi_imports)

          def repair_unified(s):
              # The old file contains an orphaned switch case after the class.
              # Remove only that orphan and preserve the actual class closing brace.
              s = re.sub(
                  r"\n\s*case 'proot_status':.*?(?=\Z)",
                  '\n', s, count=1, flags=re.S)
              # If the class was prematurely closed before the command switch,
              # remove the single extra brace immediately following _dnsLookup.
              s = re.sub(
                  r'(Future<String> _dnsLookup\(String d\) async \{.*?\n  \})\n  \}\n',
                  r'\1\n', s, count=1, flags=re.S)
              return s
          edit('lib/core/services/unified_core_service.dart', repair_unified)

          def repair_help(s):
              # The source contains a duplicated/truncated widget tail beginning
              # with the malformed `},'Phone'` fragment. Keep the valid class body
              # before it and restore one class terminator.
              marker = "},'Phone', Icons.phone),child: Column("
              if marker in s:
                  s = s.split(marker, 1)[0].rstrip() + '\n}\n'
              return s
          edit('lib/screens/help/advanced_help_center.dart', repair_help)

          def repair_settings(s):
              # Remove only the known orphaned block appended after the real class.
              return re.sub(r'\n\}\n\n  void _resetAllSettings\(\) async \{.*\Z', '\n}\n', s, count=1, flags=re.S)
          edit('lib/screens/settings/settings_screen.dart', repair_settings)

          def repair_wifi_panel(s):
              # The trailing strategy widget was appended outside its State class
              # and references attack-execution helpers that are not part of the
              # valid panel. Preserve the real assessment UI and discard only the
              # malformed orphan tail.
              marker = '\n  // إضافة أزرار للاستراتيجيات الجديدة'
              if marker in s:
                  s = s.split(marker, 1)[0].rstrip() + '\n'
              return s
          edit('lib/src/features/wifi/zion_wifi_panel_real.dart', repair_wifi_panel)
          PY

      - name: Format Dart sources
        run: dart format lib test

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No repair changes were required.'
            exit 0
          fi
          git add lib test
          git commit -m 'fix: repair remaining Dart syntax corruption'
          git push origin main
