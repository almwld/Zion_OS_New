name: Build Zion OS APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zion-os-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.22.0'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Surgical Dart repair
        run: python3 tool/repair_dart_corruption.py

      - name: Verify repaired sources have no known corruption markers
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n --include='*.dart' -E "SingleChildScrollWidget\('Phone'|\);n" lib
          ! grep -n "}','Phone', Icons.phone),child: Column(" lib/screens/help/advanced_help_center.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Verify required Flutter assets and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          test -d assets/fonts
          test -f assets/icons/app_icon.png
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png || test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.webp

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          for apk in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk; do
            test -s "$apk"
            echo "Verified: $apk ($(stat -c%s "$apk") bytes)"
          done

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30
