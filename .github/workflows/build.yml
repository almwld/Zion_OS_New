name: Build Zion OS Android

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zion-os-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Zion OS Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Zion OS source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.38.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate fresh Zion OS Android project
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --project-name=zion_os \
            --org=com.zionos \
            --android-language=kotlin \
            .

      - name: Install Zion OS dependencies
        run: flutter pub get

      - name: Verify Zion OS repository assets
        shell: bash
        run: |
          test -f assets/translations/en.json
          test -f assets/translations/ar.json
          test -f assets/icons/app_icon.png
          test -d assets/icons/svg_colors
          test -d assets/images
          test -d assets/fonts

      - name: Build Zion OS release APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify Zion OS APK outputs
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload Zion OS Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-android-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
