name: Build Zion OS Android

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zion-os-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Zion OS Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Zion OS source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # ============================================
      # 🎨 توليد الأيقونات من ملف PNG الموجود
      # ============================================
      
      - name: Setup flutter_launcher_icons
        run: |
          echo "🎨 Setting up icon generation..."
          
          # التأكد من وجود ملف الأيقونة
          if [ ! -f "assets/icons/app_icon.png" ]; then
            echo "❌ Error: assets/icons/app_icon.png not found!"
            exit 1
          fi
          
          echo "✅ Found app_icon.png at assets/icons/app_icon.png"

      - name: Generate app icons
        run: |
          echo "🎨 Generating app icons from assets/icons/app_icon.png..."
          
          # تثبيت flutter_launcher_icons
          flutter pub add --dev flutter_launcher_icons
          
          # إنشاء ملف التكوين
          cat > flutter_launcher_icons.yaml << 'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icons/app_icon.png"
            adaptive_icon_background: "#1a237e"
            adaptive_icon_foreground: "assets/icons/app_icon.png"
            min_sdk_android: 21
          EOF
          
          # توليد الأيقونات
          flutter pub get
          flutter pub run flutter_launcher_icons:main -f flutter_launcher_icons.yaml
          
          echo "✅ Icons generated successfully!"

      # ============================================
      # 🔧 إصلاح Android configuration
      # ============================================

      - name: Fix Android configuration
        run: |
          echo "🔧 Fixing Android configuration..."
          
          # تحديث gradle-wrapper.properties
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # تحديث build.gradle (project level)
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF

          # تحديث build.gradle (app level) مع desugaring
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              compileSdkVersion 34
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {
                  applicationId "com.zionos"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0.0"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

          # تحديث AndroidManifest.xml
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.zionos">
              
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              
              <application
                  android:label="Zion OS"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:theme="@style/LaunchTheme">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>
                          
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>
              </application>
          </manifest>
          EOF

          # إنشاء ملفات styles
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF

          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/launch_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
          </layer-list>
          EOF

          echo "✅ Android configuration fixed!"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build/
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Verify assets
        shell: bash
        run: |
          echo "🔍 Verifying assets..."
          [ -f assets/icons/app_icon.png ] && echo "✅ app_icon.png found" || echo "⚠️ app_icon.png missing"
          [ -d assets/images ] && echo "✅ images found" || echo "⚠️ images missing"
          [ -d assets/fonts ] && echo "✅ fonts found" || echo "⚠️ fonts missing"

      - name: Build Zion OS release APKs
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Verify APK outputs
        shell: bash
        run: |
          echo "📦 Checking APK outputs..."
          ls -lh build/app/outputs/flutter-apk/
          
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            echo "✅ ARM64 APK found"
          else
            echo "❌ ARM64 APK missing"
            exit 1
          fi
          
          echo "✅ APK verification complete!"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-android-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30
