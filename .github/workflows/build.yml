name: Build Zion OS APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zion-os-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.10'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.ZION_RELEASE_KEYSTORE_B64 }}
      APPETIZE_API_KEY: ${{ secrets.APPETIZE_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Prepare Android PRoot runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/OpenMinis/OpenMinis.git "$RUNNER_TEMP/openminis"
          cd "$RUNNER_TEMP/openminis"
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/assets"
          cp assets/proot-aarch64 "$GITHUB_WORKSPACE/android/app/src/main/assets/proot-aarch64"
          cp src/android/app/src/main/jniLibs/arm64-v8a/libproot.so "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/"
          cp src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/"
          cp src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/assets/proot-aarch64"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libproot.so"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch bundled Musnad font
        run: bash tool/fetch_musnad_font.sh

      - name: Run Flutter static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Verify required Flutter assets and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          test -d assets/fonts
          test -f assets/icons/app_icon.png
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png || test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.webp

      - name: Configure protected release signing
        if: env.RELEASE_KEYSTORE_B64 != ''
        shell: bash
        env:
          KEYSTORE_B64: ${{ env.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ZION_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZION_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZION_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zion-release.jks"
          test -s "$RUNNER_TEMP/zion-release.jks"
          {
            echo "ZION_RELEASE_STORE_FILE=$RUNNER_TEMP/zion-release.jks"
            echo "ZION_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ZION_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ZION_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Verify AAB output
        shell: bash
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          echo "Verified AAB: $AAB ($(stat -c%s "$AAB") bytes)"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK outputs and signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk; do
            test -s "$apk"
            "$APKSIGNER" verify --verbose "$apk"
            echo "Verified signed APK: $apk ($(stat -c%s "$apk") bytes)"
          done

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Appetize cloud test
        id: appetize
        if: ${{ env.APPETIZE_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.appetize.io/v1/apps" \
            -H "X-API-KEY: $APPETIZE_API_KEY" \
            -F "file=@$APK" \
            -F "platform=android")"
          echo "$RESPONSE" > "$RUNNER_TEMP/appetize-response.json"
          APP_URL="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("publicURL",""))' "$RUNNER_TEMP/appetize-response.json")"
          test -n "$APP_URL"
          echo "APPETIZE_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "Appetize URL: $APP_URL"

      - name: Build summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Build summary"
            echo
            echo "### Appetize cloud test"
            if [ -n "${APPETIZE_URL:-}" ]; then
              echo
              echo "### [Open Zion OS in Appetize](${APPETIZE_URL})"
              echo
              echo "Appetize upload completed successfully for the arm64-v8a release APK."
            elif [ -n "${APPETIZE_API_KEY:-}" ]; then
              echo
              echo "Appetize upload was attempted but no public URL was returned."
              echo "Check the Appetize upload step logs."
            else
              echo
              echo "Appetize cloud test skipped: repository secret APPETIZE_API_KEY is not configured."
              echo "Add APPETIZE_API_KEY to enable the live Appetize link."
            fi
            echo
            echo "Job summary generated at run-time"
          } >> "$GITHUB_STEP_SUMMARY"
