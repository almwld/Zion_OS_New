name: Build Zion Userland Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zion-userland.yml'
      - 'lib/core/userland/**'
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 0'

permissions:
  contents: write

jobs:
  build-arm64-userland:
    name: Build Zion/Termux-compatible arm64 Userland
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Zion OS
        uses: actions/checkout@v4

      - name: Checkout Termux package build system
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: master
          path: .termux-packages

      - name: Configure forked Termux package paths for Zion
        shell: bash
        working-directory: .termux-packages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/properties.sh")
          s = p.read_text()
          replacements = {
              'TERMUX__NAME="Termux"': 'TERMUX__NAME="Zion"',
              'TERMUX_APP__PACKAGE_NAME="com.termux"': 'TERMUX_APP__PACKAGE_NAME="com.zion.os"',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -nE 'TERMUX__NAME=|TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh

      - name: Build arm64 bootstrap
        working-directory: .termux-packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 --add curl,wget,git,python,openssh,proot

      - name: Validate bootstrap
        working-directory: .termux-packages
        shell: bash
        run: |
          set -euo pipefail
          test -s bootstrap-aarch64.zip
          unzip -l bootstrap-aarch64.zip | grep -E '(^|/)bin/bash$|(^|/)bin/apt$|(^|/)bin/dpkg$|(^|/)bin/coreutils$' >/dev/null
          sha256sum bootstrap-aarch64.zip

      - name: Publish Zion Userland release
        working-directory: .termux-packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="zion-userland-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" bootstrap-aarch64.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Zion Userland $TAG" \
            --notes "Zion Userland bootstrap built from the Termux package build system for com.zion.os / arm64." \
            --latest
