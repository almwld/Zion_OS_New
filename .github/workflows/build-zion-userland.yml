name: Build Zion Userland

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-zion-userland.yml"
      - "lib/core/userland/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Zion
        uses: actions/checkout@v4

      - name: Build custom Android arm64 Userland
        shell: bash
        run: |
          set -euo pipefail
          rm -rf termux-packages
          git clone --depth 1 --branch infra-improvs https://github.com/agnostic-apollo/termux-packages.git termux-packages
          cd termux-packages
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/properties.sh")
          s = p.read_text()
          s = s.replace('TERMUX__NAME="Termux"', 'TERMUX__NAME="Zion"')
          s = s.replace('TERMUX_APP__PACKAGE_NAME="com.termux"', 'TERMUX_APP__PACKAGE_NAME="com.zion.os"')
          p.write_text(s)
          PY
          # The builder image can lag behind the bootstrap branch's pinned NDK.
          # Provision the exact SDK/NDK declared by properties.sh before compiling.
          ./scripts/run-docker.sh ./scripts/setup-android-sdk.sh
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64

      - name: Convert bootstrap to verified Zion archive
        shell: python
        run: |
          import hashlib, json, os, zipfile
          from pathlib import Path

          source = Path("termux-packages/bootstrap-aarch64.zip")
          out = Path("zion-userland-aarch64.zip")
          if not source.exists():
              raise SystemExit("bootstrap-aarch64.zip was not produced")

          files = {}
          symlinks = []

          with zipfile.ZipFile(source) as zin, zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zout:
              # Termux bootstraps deliberately encode symlinks in SYMLINKS.txt
              # instead of storing filesystem symlink entries in the ZIP.
              for info in zin.infolist():
                  if info.is_dir() or info.filename == "SYMLINKS.txt":
                      continue
                  name = info.filename.replace("\\", "/")
                  while name.startswith("./"):
                      name = name[2:]
                  if name.startswith("/") or ".." in Path(name).parts or not name:
                      raise SystemExit(f"unsafe source path: {name}")
                  target = "usr/" + name
                  data = zin.read(info)
                  zi = zipfile.ZipInfo(target, info.date_time)
                  zi.create_system = info.create_system
                  zi.external_attr = info.external_attr
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zout.writestr(zi, data)
                  files[target] = hashlib.sha256(data).hexdigest()

              try:
                  raw_links = zin.read("SYMLINKS.txt").decode("utf-8")
              except KeyError:
                  raw_links = ""

              for line in raw_links.splitlines():
                  if "←" not in line:
                      continue
                  link_target, link_name = line.split("←", 1)
                  link_target = link_target.strip().replace("\\", "/")
                  link_name = link_name.strip().replace("\\", "/")
                  while link_name.startswith("./"):
                      link_name = link_name[2:]
                  if (not link_name or link_name.startswith("/") or
                      ".." in Path(link_name).parts or
                      not link_target or link_target.startswith("/") or
                      ".." in Path(link_target).parts):
                      raise SystemExit(f"unsafe symlink: {link_target} -> {link_name}")
                  archive_link = "usr/" + link_name
                  # The installer validates the target stays inside usr/.
                  zi = zipfile.ZipInfo(archive_link)
                  zi.create_system = 3
                  zi.external_attr = (0o120777 << 16) | 0x80000000
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zout.writestr(zi, link_target.encode("utf-8"))
                  files[archive_link] = hashlib.sha256(link_target.encode("utf-8")).hexdigest()
                  symlinks.append({"path": archive_link, "target": link_target})

              manifest = {
                  "format": "zion-userland-v1",
                  "release": os.environ.get("GITHUB_SHA", "unknown")[:12],
                  "source": "termux-packages-custom-prefix",
                  "abi": "aarch64",
                  "symlinks": symlinks,
                  "files": files,
              }
              zout.writestr(
                  "zion-manifest.json",
                  json.dumps(manifest, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode(),
              )

          print(f"Created {out} with {len(files)} verified files")

      - name: Create single bootstrap endpoint manifest
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path

          archive = Path("zion-userland-aarch64.zip")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          endpoint = {
              "format": "zion-bootstrap-endpoint-v1",
              "release": "${{ github.sha }}"[:12],
              "assets": {
                  "aarch64": {
                      "url": "https://github.com/almwld/Zion_OS_New/releases/download/zion-userland-latest/zion-userland-aarch64.zip",
                      "sha256": digest,
                      "size": archive.stat().st_size,
                  }
              },
          }
          Path("bootstrap.json").write_text(
              json.dumps(endpoint, ensure_ascii=False, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )

      - name: Publish Userland release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="zion-userland-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" zion-userland-aarch64.zip bootstrap.json \
            --title "Zion Userland (latest)" \
            --notes "Generated from a custom-prefix Termux bootstrap for com.zion.os. The archive is SHA-256 verified by Zion before activation."
          gh release download "$TAG" --pattern bootstrap.json --output published-bootstrap.json
          test -s published-bootstrap.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("published-bootstrap.json").read_text())
          assert data["format"] == "zion-bootstrap-endpoint-v1"
          asset = data["assets"]["aarch64"]
          assert asset["url"].endswith("/zion-userland-aarch64.zip")
          assert len(asset["sha256"]) == 64
          assert asset["size"] > 0
          print("Verified published single bootstrap endpoint manifest")
          PY
