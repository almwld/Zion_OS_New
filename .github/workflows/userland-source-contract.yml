name: Userland source contract

on:
  pull_request:
    paths:
      - 'USERLAND.md'
      - 'android/app/src/main/kotlin/com/zion/os/TermuxBootstrapInstaller.kt'
      - 'android/app/src/main/kotlin/com/zion/os/MainActivity.kt'
      - 'android/app/src/main/cpp/zion_pty.c'
      - '.github/workflows/userland-source-contract.yml'
  push:
    paths:
      - 'USERLAND.md'
      - 'android/app/src/main/kotlin/com/zion/os/TermuxBootstrapInstaller.kt'
      - 'android/app/src/main/kotlin/com/zion/os/MainActivity.kt'
      - 'android/app/src/main/cpp/zion_pty.c'
      - '.github/workflows/userland-source-contract.yml'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check persistent bootstrap and PTY source contracts
        shell: bash
        run: |
          set -euo pipefail
          installer='android/app/src/main/kotlin/com/zion/os/TermuxBootstrapInstaller.kt'
          activity='android/app/src/main/kotlin/com/zion/os/MainActivity.kt'
          pty='android/app/src/main/cpp/zion_pty.c'

          test -s "$installer"
          test -s "$activity"
          test -s "$pty"
          test -s USERLAND.md

          grep -q 'fun ensureInstalled(context: Context)' "$installer"
          grep -q 'usr.bootstrap-staging' "$installer"
          grep -q 'safeChild(staging, name)' "$installer"
          grep -q 'SYMLINKS.txt' "$installer"
          grep -q 'TermuxBootstrapInstaller.ensureInstalled(this)' "$activity"
          grep -q '"/system/bin/linker64"' "$pty"
          grep -q '"/data/data/com.zion.os/files/usr/lib:/data/data/com.zion.os/files/usr/lib64"' "$pty"

          echo 'Source contract passed. This is not an Android runtime test.'
