plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Production defaults to a current target SDK. The old target is an explicit
// sideload-only diagnostic experiment for testing app-private Userland/PRoot.
def zionTargetSdk = providers.gradleProperty("zionTargetSdk")
    .map { it.toInteger() }
    .getOrElse(36)

android {
    namespace = "com.zion.os"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.zion.os"
        minSdk = 21
        // Default production/AAB target remains modern. Only the dedicated
        // CI diagnostic APK opts into API 28; this is not a SELinux bypass.
        targetSdk = zionTargetSdk
        versionCode = 45002
        versionName = "4.5.0"
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/CMakeLists.txt")
        }
    }

    // Keep the standard native-library source location explicit. CI may stage
    // ABI-specific PRoot/Termux-compatible libraries here before packaging.
    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        // API 28 is used only by the sideload diagnostic APK. Google Play
        // rejects this target, so suppress this single lint check only for
        // that explicit experiment; the normal target-36 build keeps lint on.
        if (zionTargetSdk < 33) {
            disable += "ExpiredTargetSdkVersion"
        }
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("ZION_RELEASE_STORE_FILE")
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile = file(storeFilePath)
                storePassword = System.getenv("ZION_RELEASE_STORE_PASSWORD")
                keyAlias = System.getenv("ZION_RELEASE_KEY_ALIAS")
                keyPassword = System.getenv("ZION_RELEASE_KEY_PASSWORD")
                enableV1Signing true
                enableV2Signing true
            }
        }
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Production CI uses the protected release keystore when all
            // ZION_RELEASE_* variables are supplied. Local/test builds retain
            // the debug keystore instead of inventing or committing secrets.
            signingConfig = (System.getenv("ZION_RELEASE_STORE_FILE") != null && !System.getenv("ZION_RELEASE_STORE_FILE").isBlank())
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }

}

dependencies {
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.core:core-ktx:1.13.1"
    testImplementation "junit:junit:4.13.2"
}

flutter {
    source = "../.."
}
