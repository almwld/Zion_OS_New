plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.zion.os"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.zion.os"
        minSdk = 21
        targetSdk = 36
        versionCode = 45002
        versionName = "4.5.0"
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/CMakeLists.txt")
        }
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("ZION_RELEASE_STORE_FILE")
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile = file(storeFilePath)
                storePassword = System.getenv("ZION_RELEASE_STORE_PASSWORD")
                keyAlias = System.getenv("ZION_RELEASE_KEY_ALIAS")
                keyPassword = System.getenv("ZION_RELEASE_KEY_PASSWORD")
                enableV1Signing true
                enableV2Signing true
            }
        }
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Production CI uses the protected release keystore when all
            // ZION_RELEASE_* variables are supplied. Local/test builds retain
            // the debug keystore instead of inventing or committing secrets.
            signingConfig = (System.getenv("ZION_RELEASE_STORE_FILE") != null && !System.getenv("ZION_RELEASE_STORE_FILE").isBlank())
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }

}

dependencies {
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.core:core-ktx:1.13.1"
    testImplementation "junit:junit:4.13.2"
}

flutter {
    source = "../.."
}
