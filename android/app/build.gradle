plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.zion.os"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.zion.os"
        minSdk = 21
        targetSdk = 34
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // CI/test release is signed with the Android debug keystore so the
            // generated APK is installable. Production builds must use a
            // protected release keystore outside the repository.
            signingConfig = signingConfigs.debug
        }
    }

    // Keep APK signatures compatible with both legacy Android installers
    // (APK Signature Scheme v1/JAR) and modern Android (v2).
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }
}

flutter {
    source = "../.."
}
